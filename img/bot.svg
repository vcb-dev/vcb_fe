<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- "working" robot for loading states: bobbing body, blinking eyes, pulsing antenna, turning gear, typing arms -->
  <style>
    .body { animation: bob 1.4s ease-in-out infinite; transform-origin: 60px 70px; }
    .eye { animation: blink 3.2s infinite; transform-origin: center; transform-box: fill-box; }
    .ant { animation: pulse 1s ease-in-out infinite; }
    .gear { animation: spin 2.4s linear infinite; transform-origin: 92px 34px; }
    .gear2 { animation: spin 1.8s linear infinite reverse; transform-origin: 104px 50px; }
    .armL { animation: tapL .5s ease-in-out infinite alternate; transform-origin: 38px 74px; }
    .armR { animation: tapR .5s ease-in-out infinite alternate; transform-origin: 82px 74px; }
    .dot { animation: dots 1.2s infinite; }
    .d2 { animation-delay: .2s; } .d3 { animation-delay: .4s; }
    @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1) } 95% { transform: scaleY(.1) } }
    @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
    @keyframes spin { to { transform: rotate(360deg) } }
    @keyframes tapL { from { transform: rotate(8deg) } to { transform: rotate(-10deg) } }
    @keyframes tapR { from { transform: rotate(-8deg) } to { transform: rotate(10deg) } }
    @keyframes dots { 0%,100% { opacity: .2 } 40% { opacity: 1 } }
  </style>
  <g class="gear" fill="#D4AF5A" opacity=".9">
    <path d="M92 22l3 4 5-1 1 5 4 3-3 4 1 5-5 1-3 4-4-3-5 1-1-5-4-3 3-4-1-5 5-1z"/><circle cx="92" cy="34" r="4.5" fill="#1A1407"/>
  </g>
  <g class="gear2" fill="#B8923F" opacity=".85">
    <path d="M104 42l2 3 3 0 0 3 3 2-2 3 1 3-3 1-2 3-3-2-3 1-1-3-3-2 2-3-1-3 3-1z"/><circle cx="104" cy="50" r="3" fill="#1A1407"/>
  </g>
  <g class="body">
    <line x1="60" y1="18" x2="60" y2="30" stroke="#8C8A84" stroke-width="3" stroke-linecap="round"/>
    <circle class="ant" cx="60" cy="16" r="5" fill="#E8C66E"/>
    <rect x="34" y="30" width="52" height="38" rx="12" fill="#ECEAE6" stroke="#2A2A2E" stroke-width="3"/>
    <rect x="41" y="38" width="38" height="20" rx="8" fill="#1F2430"/>
    <rect class="eye" x="49" y="44" width="7" height="9" rx="3.5" fill="#6EE7B7"/>
    <rect class="eye" x="64" y="44" width="7" height="9" rx="3.5" fill="#6EE7B7"/>
    <rect x="28" y="42" width="6" height="14" rx="3" fill="#D4AF5A"/><rect x="86" y="42" width="6" height="14" rx="3" fill="#D4AF5A"/>
    <rect x="40" y="70" width="40" height="22" rx="8" fill="#D4AF5A" stroke="#2A2A2E" stroke-width="3"/>
    <circle cx="52" cy="81" r="3" fill="#1A1407"/><circle cx="60" cy="81" r="3" fill="#6EE7B7"/><circle cx="68" cy="81" r="3" fill="#1A1407"/>
    <rect class="armL" x="24" y="72" width="16" height="7" rx="3.5" fill="#ECEAE6" stroke="#2A2A2E" stroke-width="2.5"/>
    <rect class="armR" x="80" y="72" width="16" height="7" rx="3.5" fill="#ECEAE6" stroke="#2A2A2E" stroke-width="2.5"/>
  </g>
  <rect x="22" y="98" width="76" height="8" rx="4" fill="#3A3A40"/>
  <circle class="dot" cx="48" cy="102" r="2" fill="#E8C66E"/><circle class="dot d2" cx="60" cy="102" r="2" fill="#E8C66E"/><circle class="dot d3" cx="72" cy="102" r="2" fill="#E8C66E"/>
</svg>
